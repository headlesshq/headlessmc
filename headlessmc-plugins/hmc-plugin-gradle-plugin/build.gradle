plugins {
    id 'java-gradle-plugin'
}

description = 'A Gradle plugin to build HeadlessMc plugins: nests libraries into the plugin jar (Jar-in-Jar) ' +
    'and generates the plugin manifest.'

gradlePlugin {
    website = 'https://headlesshq.github.io/headlessmc/plugins/'
    vcsUrl = 'https://github.com/headlesshq/headlessmc'
    plugins {
        hmcPluginGradlePlugin {
            id = 'io.github.headlesshq.hmc-plugin-gradle-plugin'
            implementationClass = 'io.github.headlesshq.headlessmc.plugins.gradle.HmcPluginGradlePlugin'
            displayName = 'HeadlessMc Plugin'
            description = project.description
            tags.addAll('headlessmc', 'minecraft', 'plugin', 'jar-in-jar')
        }
    }
}

// Gradle may run on an older Java than the toolchain that compiles the HeadlessMc plugin
compileJava {
    options.release = 17
}

processResources {
    inputs.property('version', project.version)
    filesMatching('**/version.properties') {
        expand(version: project.version)
    }
}

dependencies {
    testImplementation project(':headlessmc-plugins')
    testImplementation project(':headlessmc-net:headlessmc-net-hash')
    testImplementation project(':headlessmc-util:headlessmc-util-json-jackson')
    testImplementation 'org.mockito:mockito-core'
}
