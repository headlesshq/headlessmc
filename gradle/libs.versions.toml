[versions]
jline = "4.4.6"
quarkus = "3.35.3"
asm = "9.10.1"
resilience4j = "2.4.0"
jackson = "3.1.4"

[libraries]
# platform
quarkus = { module = "io.quarkus.platform:quarkus-bom", version.ref = "quarkus" }
quarkus-picocli = { module = "io.quarkus:quarkus-picocli" }
quarkus-arc = { module = "io.quarkus:quarkus-arc" }
quarkus-core = { module = "io.quarkus:quarkus-core" }
quarkus-cache = { module = "io.quarkus:quarkus-cache" }
quarkus-junit = { module = "io.quarkus:quarkus-junit" }
quarkus-junit-component = { module = "io.quarkus:quarkus-junit-component" }
quarkus-jacoco = { module = "io.quarkus:quarkus-jacoco" }
quarkus-rest-client = { module = "io.quarkus:quarkus-rest-client" }
quarkus-rest-client-jackson = { module = "io.quarkus:quarkus-rest-client-jackson" }

asm = { group = "org.ow2.asm", name = "asm", version.ref = "asm" }
asm-tree = { group = "org.ow2.asm", name = "asm-tree", version.ref = "asm" }
auth = { group = "net.raphimc", name = "MinecraftAuth", version = "5.0.1" }

cdi = { group = "jakarta.enterprise", name = "jakarta.enterprise.cdi-api" }

commons-lang3 = { group = "org.apache.commons", name = "commons-lang3", version = "3.20.0" }
commons-compress = { group = "org.apache.commons", name = "commons-compress", version = "1.28.0" }
commons-configuration = { group = "org.apache.commons", name = "commons-configuration2", version = "2.15.1" }
# maybe for inputstream? But ObservableInputStream is problematic
#commons-io = { group = "commons-io", name = "commons-io", version = "2.22.0" }

disco-client = { group = "io.foojay.api", name = "discoclient", version = "21.0.1" }

#fabric = { group = "net.fabricmc", name = "fabric-loader", version = "0.18.5" }
#fabric-installer = { group = "net.fabricmc", name = "fabric-loader", version = "0.18.5" }

gson = { group = "com.google.code.gson", name = "gson", version = "2.14.0" }
# legacy version to test if Auth can work if we work with a legacy version
# gson-legacy = { group = "com.google.code.gson", name = "gson", version = "2.2.2" }

inject = { group = "jakarta.inject", name = "jakarta.inject-api" }

# TODO: Quarkus has not yet updated to jackson 3.x: https://github.com/quarkusio/quarkus/issues/52036
# TODO: we cannot update to jackson 3.2.0, otherwise we get:
# com/fasterxml/jackson/annotation/JsonApplyView
# java.lang.NoClassDefFoundError: com/fasterxml/jackson/annotation/JsonApplyView
#   at tools.jackson.databind.introspect.JacksonAnnotationIntrospector.findApplyView(JacksonAnnotationIntrospector.java:556)
jackson = { group = "tools.jackson.core", name = "jackson-databind", version.ref = "jackson" }
jackson-toml = { group = "tools.jackson.dataformat", name = "jackson-dataformat-toml", version.ref = "jackson" }
jackson-yaml = { group = "tools.jackson.dataformat", name = "jackson-dataformat-yaml", version.ref = "jackson" }

#jimfs = { group = "com.google.jimfs", name = "jimfs", version = "1.3.0" }
jdktools = { group = "eu.hansolo", name = "jdktools", version = "21.0.41" }
jetbrains-annotations = { group = "org.jetbrains", name = "annotations", version = "26.1.0" }

jline = { group = "org.jline", name = "jline", version.ref = "jline" }
jline-picocli = { group = "org.jline", name = "jline-picocli", version.ref = "jline" }
# Optional dependency of jline, only used by org.jline.builtins.Nano to detect a files charset.
# Native image builds fail without it, because Quarkus passes --link-at-build-time, which turns
# the unresolved UniversalDetector reference in Nano into a build error.
juniversalchardet = { group = "com.googlecode.juniversalchardet", name = "juniversalchardet", version = "1.0.3" }

jspecify = { group = "org.jspecify", name = "jspecify", version = "1.0.1" }

lombok = { group = "org.projectlombok", name = "lombok", version = "1.18.46" }

picocli = { group = "info.picocli", name = "picocli", version = "4.7.7" }
progressbar = { group = "me.tongfei", name = "progressbar", version = "0.10.2" }

# Resilience4J libraries, maybe for parallel downloads, Assets/Libraries
resilience4j = { group = "io.github.resilience4j", name = "resilience4j-all", version.ref = "resilience4j" }
#resilience4j-circuitbreaker = { group = "io.github.resilience4j", name = "resilience4j-circuitbreaker", version.ref = "resilience4j" }
#resilience4j-ratelimiter = { group = "io.github.resilience4j", name = "resilience4j-ratelimiter", version.ref = "resilience4j" }
#resilience4j-bulkhead = { group = "io.github.resilience4j", name = "resilience4j-bulkhead", version.ref = "resilience4j" }
resilience4j-retry = { group = "io.github.resilience4j", name = "resilience4j-retry", version.ref = "resilience4j" }
#resilience4j-cache = { group = "io.github.resilience4j", name = "resilience4j-cache", version.ref = "resilience4j" }
#resilience4j-timelimiter = { group = "io.github.resilience4j", name = "resilience4j-timelimiter", version.ref = "resilience4j" }

jboss-logmanager = { group = "org.jboss.logmanager", name = "jboss-logmanager" }
slf4j-jboss = { group = "org.jboss.slf4j", name = "slf4j-jboss-logmanager" }
slf4j = { group = "org.slf4j", name = "slf4j-api" }
slugify = { group = "com.github.slugify", name = "slugify", version = "4.0.1" }

smallrye-config = { group = "io.smallrye.config", name = "smallrye-config" }

xz = { group = "org.tukaani", name = "xz", version = "1.12" }

[plugins]
versions = { id = "com.github.ben-manes.versions", version = "0.64.0" }
quarkus = { id = "io.quarkus", version.ref = "quarkus" }
