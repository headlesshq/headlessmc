name: Server Test

"on":
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build HeadlessMc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6

      - name: Build uber jar
        run: ./gradlew :headlessmc-application:quarkusBuild -PuberJar --stacktrace

      - name: Rename uber jar
        run: mv headlessmc-application/build/headlessmc-application-*-runner.jar headlessmc.jar

      - uses: actions/upload-artifact@v7
        with:
          name: headlessmc-server-test
          path: headlessmc.jar
          retention-days: 1

  server-test:
    name: ${{ matrix.platform }} ${{ matrix.mc }} ${{ matrix.os }}${{ (matrix.platform == 'forge' || matrix.platform == 'neoforge') && (matrix.mock-java && ' mock-java' || ' script') || '' }}
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Windows pipes only buffer ~4KB, servers block if HeadlessMc does not read all of their output
        os: [ ubuntu-latest, windows-latest ]
        # vanilla and fabric print more than 4KB during the EULA launch,
        # forge and neoforge 26.3 print more than 4KB to stderr while starting
        platform: [ vanilla, fabric, forge, neoforge ]
        mc: [ 1.21.1, 26.3 ]
        # tests both ways of launching run.sh/run.bat, see hmc.server.script.mock-java
        mock-java: [ false, true ]
        exclude:
          # only forge and neoforge are launched via run.sh/run.bat
          - platform: vanilla
            mock-java: true
          - platform: fabric
            mock-java: true
    defaults:
      run:
        shell: bash
    env:
      HMC: java -Dhmc.jline.enabled=false
    steps:
      # HeadlessMc and the 26.3 server run on Java 25, the 1.21.1 server needs Java 21
      - uses: actions/setup-java@v6
        with:
          java-version: |
            21
            25
          distribution: temurin

      - uses: actions/download-artifact@v8
        with:
          name: headlessmc-server-test
          path: .

      - name: Install the server
        run: $HMC -jar headlessmc.jar server add ${{ matrix.platform }} ${{ matrix.mc }} --name test-server --dir "$GITHUB_WORKSPACE/server"

      - name: Run the server test
        # hmc.test.server runs headlessmc-test/src/main/resources/test/hmc-server-test.json:
        # it waits for 'For help, type "help"' and then sends 'stop'
        run: >
          $HMC
          -Dhmc.test.server=true
          -Dhmc.server.script.mock-java=${{ matrix.mock-java }}
          -jar headlessmc.jar server launch test-server --eula-accept

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: server-logs-${{ matrix.platform }}-${{ matrix.mc }}-${{ matrix.os }}${{ (matrix.platform == 'forge' || matrix.platform == 'neoforge') && (matrix.mock-java && '-mock-java' || '-script') || '' }}
          path: |
            server/logs/**
            server/crash-reports/**
            server/*.log
            server/hs_err_pid*.log
          if-no-files-found: ignore
          retention-days: 7
