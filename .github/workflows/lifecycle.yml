name: Lifecycle

"on":
  push:
    branches:
      - main
  pull_request:
    types:
      #- closed
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

concurrency: # FIXME: prevent release commit cancellation
  group: >
    ${{ github.workflow }}-
    ${{ github.event_name }}-
    ${{ github.event.inputs.ref || github.ref }}
  # never cancel runs on main, they might be creating a release
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY_IMAGE: 3arthqu4ke/headlessmc

jobs:
  release-please:
    name: Release Please
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release-please.outputs.release_created }}
      tag_name: ${{ steps.release-please.outputs.tag_name }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: release-please
        name: Run Release Please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: 25
          distribution: temurin
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Test, coverage and build
        run: ./gradlew jacocoRootReport build :headlessmc-application:quarkusBuild -PuberJar --stacktrace

      - name: Add coverage to PR
        if: github.event_name == 'pull_request'
        id: jacoco
        uses: madrapps/jacoco-report@e51ce1f46f7f8b5331593f935e59cbaf44b84920 # v1.8.0
        with:
          paths: |
            ${{ github.workspace }}/build/reports/jacoco/root/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 40
          min-coverage-changed-files: 60

      - name: Upload Test Reports
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore

      #- name: Publish with gradle
      #  if: needs.release-please.outputs.release_created == 'true'
      #  env:
      #    IS_MAVEN_PUB: true
      #    DEPLOY_TO_GITHUB_PACKAGES_URL: https://maven.pkg.github.com/headlesshq/headlessmc
      #    GITHUB_USER: ${{ github.actor }}
      #    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #  run: ./gradlew publish

      - name: Rename uber jar
        run: mv headlessmc-application/build/headlessmc-application-*-runner.jar headlessmc-application/build/quarkus-build/gen/headlessmc.jar

      - name: Publish Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: HeadlessMc Launcher files
          path: |
            ./headlessmc-application/build/quarkus-build/gen/headlessmc.jar
            ./headlessmc-lwjgl/build/libs/headlessmc-lwjgl-*-all.jar
            ./headlessmc-lwjgl/build/noasm/headlessmc-lwjgl-*-no-asm.jar

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: 3.x
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-
      - run: pip install mkdocs-material
      - name: Build documentation
        run: mkdocs build -d _site

      # Prepare Site deployment
      #- name: Copy javadoc
      #  if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      #  run: cp -r build/docs/javadoc/ _site/
      - name: Rename report dir
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: mv build/reports/jacoco/root build/reports/jacoco/coverage
      - name: Copy coverage
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cp -r build/reports/jacoco/coverage/ _site/
      - name: Upload Web page artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0

  deploy-pages:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main')
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: github-pages
          path: .
      - name: Display structure of downloaded files
        run: ls -R
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  build-natives:
    runs-on: ${{ matrix.os.os }}
    strategy:
      matrix:
        os:
          - { os: windows-latest,   name: headlessmc-launcher-windows-x64}
          - { os: ubuntu-latest,    name: headlessmc-launcher-linux-x64 }
          - { os: ubuntu-24.04-arm, name: headlessmc-launcher-linux-arm64 }
          - { os: macos-latest,     name: headlessmc-launcher-macos-arm64 }
          #- { os: windows-11-arm, name: headlessmc-launcher-windows-arm64 } no graalvm for windows arm64 :(
        # macOS x64 builds take verrryyy long, so I only want to do this on main
        include: ${{ fromJSON(github.event_name == 'push' && github.ref == 'refs/heads/main' && '[{"os":{"os":"macos-15-intel","name":"headlessmc-launcher-macos-x64"} }]' || '[]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # native image builds take very long, reuse the executable if nothing it is built from has changed
      - name: Cache native image
        id: native-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          key: native-image-${{ matrix.os.name }}-${{ hashFiles('gradle/**', 'headlessmc-*/**', 'src/**', 'scripts/**', '.gitignore', 'build.gradle', 'gradle.properties', 'gradlew', 'gradlew.bat', 'lombok.config', 'settings.gradle') }}
          path: headlessmc-application/build/${{ matrix.os.name }}*

      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # v1
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Output Graal Info
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          echo "GRAALVM_HOME: $GRAALVM_HOME"
          echo "JAVA_HOME: $JAVA_HOME"
          java --version
          native-image --version

      - name: Grant execute permission for gradlew
        if: runner.os != 'Windows' && steps.native-cache.outputs.cache-hit != 'true'
        run: chmod +x gradlew

      - name: Grant execute permission for script
        if: runner.os != 'Windows' && steps.native-cache.outputs.cache-hit != 'true'
        run: chmod +x scripts/build-native.sh

      - name: Build with Script
        if: steps.native-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            sudo sysctl -w kern.maxfiles=524288
            sudo sysctl -w kern.maxfilesperproc=524288
            sudo launchctl limit maxfiles 524288 524288
            ulimit -n 524288
          fi
          bash scripts/build-native.sh

      - name: List files
        if: runner.os != 'Windows' && steps.native-cache.outputs.cache-hit != 'true'
        run: ls headlessmc-application/build

      - name: Rename executable
        if: runner.os != 'Windows' && steps.native-cache.outputs.cache-hit != 'true'
        run: mv headlessmc-application/build/headlessmc-application-*-runner headlessmc-application/build/${{ matrix.os.name }}

      - name: Rename executable
        if: runner.os == 'Windows' && steps.native-cache.outputs.cache-hit != 'true'
        run: Move-Item "headlessmc-application/build/headlessmc-application-*-runner.exe" "headlessmc-application/build/${{ matrix.os.name }}.exe"

      - name: Smoke test executable
        shell: bash
        run: |
          EXE="headlessmc-application/build/${{ matrix.os.name }}"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            EXE="$EXE.exe"
          else
            chmod +x "$EXE"
          fi
          "$EXE" help

      - name: Publish Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: HeadlessMc Native Image ${{ matrix.os.name }}
          path: |
            ./headlessmc-application/build/${{ matrix.os.name }}*

  # https://github.com/headlesshq/headlessmc/issues/333
  build-mc-runtime-test:
    strategy:
      fail-fast: false
      matrix:
        version:
          # the following line should always be here,
          # regardless if mc-runtime-test already supports this version or not
          # to test if this step works
          - { branch: 286a6d64008be90fc82f8ffadb8f111adab6907e, dir: 26_3,    mc: 26.3,    lex: 66.0.2,             neo: 6-beta,  java: 25 }
          - { branch: 286a6d64008be90fc82f8ffadb8f111adab6907e, dir: 1_21_11, mc: 1.21.11, lex: 61.0.6,             neo: 35-beta, java: 21 }
          - { branch: 286a6d64008be90fc82f8ffadb8f111adab6907e, dir: 1_12,    mc: 1.12.2,  lex: 14.23.5.2860,       neo: '',      java: 8 }
          - { branch: 286a6d64008be90fc82f8ffadb8f111adab6907e, dir: 1_8_9,   mc: 1.8.9,   lex: 11.15.1.2318-1.8.9, neo: '',      java: 8 }
    uses: ./.github/workflows/build-runtime-test.yml
    if: '!cancelled()' # run always cause we want to see how each version is doing
    #if: false for when mc-runtime-test is up to date and HeadlessMc can launch any version
    with:
      branch: ${{ matrix.version.branch }}
      dir: ${{ matrix.version.dir }}
      mc: ${{ matrix.version.mc }}
      lex: ${{ matrix.version.lex }}
      neo: ${{ matrix.version.neo }}
      java: ${{ matrix.version.java }}

  mc-runtime-test:
    strategy:
      fail-fast: false
      matrix:
        version:
          # the following line should always be here,
          # regardless if mc-runtime-test already supports this version or not
          # to test if this step works
          - { mc: 26.3,    type: fabric,   modloader: fabric,   java: 25, xvfb: false }
          - { mc: 26.3,    type: neoforge, modloader: neoforge, java: 25, xvfb: false }
          - { mc: 26.3,    type: lexforge, modloader: forge,    java: 25, xvfb: false }
          - { mc: 1.21.11, type: neoforge, modloader: neoforge, java: 21, xvfb: false }
          - { mc: 1.12.2,  type: lexforge, modloader: forge,    java: 8,  xvfb: false }
          - { mc: 1.8.9,   type: lexforge, modloader: forge,    java: 8,  xvfb: false }
          - { mc: 26.3,    type: fabric,   modloader: fabric,   java: 25, xvfb: true  }
          - { mc: 26.3,    type: neoforge, modloader: neoforge, java: 25, xvfb: true  }
          - { mc: 26.3,    type: lexforge, modloader: forge,    java: 25, xvfb: true  }
          - { mc: 1.21.11, type: neoforge, modloader: neoforge, java: 21, xvfb: true  }
          - { mc: 1.12.2,  type: lexforge, modloader: forge,    java: 8,  xvfb: true  }
          - { mc: 1.8.9,   type: lexforge, modloader: forge,    java: 8,  xvfb: true  }
    runs-on: ubuntu-latest
    if: '!cancelled()' # run always cause we want to see how each version is doing
    #if: false for when mc-runtime-test is up to date and HeadlessMc can launch any version
    needs: [ build, build-mc-runtime-test ]
    steps:
      - name: Install Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: ${{ matrix.version.java }}
          distribution: "temurin"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: mcrt-${{ matrix.version.mc }}
          path: .

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: HeadlessMc Launcher files
          path: hmc

      - name: Display structure of downloaded files
        run: ls -R

      - name: Copy mc-runtime-test jar
        run: mkdir -p run/mods; cp mc-runtime-test-${{ matrix.version.mc }}-*-${{ matrix.version.type }}-release.jar run/mods
      - name: Copy launcher jar
        # with download-hmc: false mc-runtime-test v3 expects headlessmc.jar in the working directory
        run: cp hmc/headlessmc-application/build/quarkus-build/gen/headlessmc.jar headlessmc.jar

      - name: Run the MC client
        uses: headlesshq/mc-runtime-test@dfc8a2a0145f723b01abda5e1cf59eaba516d128 # main
        with:
          mc: ${{ matrix.version.mc }}
          modloader: ${{ matrix.version.modloader }}
          java: ${{ matrix.version.java }}
          mc-runtime-test: none
          # the action adds -lwjgl itself when xvfb is false
          xvfb: ${{ matrix.version.xvfb }}
          headlessmc-command: >-
            --retries 2 --jvm '"-Djava.awt.headless=true${{ matrix.version.mc == '26.3' && ' -DMcRuntimeGameTestInstance=minecraft:always_pass -DMcRuntimeGameTestMinExpectedGameTests=1' || '' }}"'
          download-hmc: false

  server-test:
    name: server-test ${{ matrix.platform }} ${{ matrix.mc }} ${{ matrix.os }}${{ (matrix.platform == 'forge' || matrix.platform == 'neoforge') && (matrix.mock-java && ' mock-java' || ' script') || '' }}
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        platform: [ vanilla, fabric, forge, neoforge ]
        mc: [ 1.21.1, 26.3 ]
        mock-java: [ false, true ]
        exclude:
          - platform: vanilla
            mock-java: true
          - platform: fabric
            mock-java: true
    defaults:
      run:
        shell: bash
    env:
      HMC: java -Dhmc.jline.enabled=false
    steps:
      # HeadlessMc and the 26.3 server run on Java 25, the 1.21.1 server needs Java 21
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: |
            21
            25
          distribution: temurin

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: HeadlessMc Launcher files
          path: hmc

      - name: Copy launcher jar
        run: cp hmc/headlessmc-application/build/quarkus-build/gen/headlessmc.jar headlessmc.jar

      - name: Install the server
        run: $HMC -jar headlessmc.jar server add ${{ matrix.platform }} ${{ matrix.mc }} --name test-server --dir "$GITHUB_WORKSPACE/server"

      - name: Run the server test
        run: >
          $HMC
          -Dhmc.test.server=true
          -Dhmc.server.script.mock-java=${{ matrix.mock-java }}
          -jar headlessmc.jar server launch test-server --eula-accept

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: server-logs-${{ matrix.platform }}-${{ matrix.mc }}-${{ matrix.os }}${{ (matrix.platform == 'forge' || matrix.platform == 'neoforge') && (matrix.mock-java && '-mock-java' || '-script') || '' }}
          path: |
            server/logs/**
            server/crash-reports/**
            server/*.log
            server/hs_err_pid*.log
          if-no-files-found: ignore
          retention-days: 7

  docker-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV          

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to Docker Hub
        if: |
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: 25
          distribution: temurin
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      # TODO: actually we could just include the uber-jar from the build job
      # TODO: even better, we could just build a native Docker image?
      - name: Build quick
        run: ./gradlew :headlessmc-application:quarkusBuild --stacktrace

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./headlessmc-application
          file: ./headlessmc-application/src/main/docker/Dockerfile.jvm
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"          

      - name: Upload digest
        if: |
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-release:
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [ release-please, docker-build, build, build-natives]
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.release-please.outputs.tag_name }},enable=${{ needs.release-please.outputs.release_created == 'true' }}

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)          

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:latest       

  merge:
    runs-on: ubuntu-latest
    if: needs.release-please.outputs.release_created == 'true'
    needs: [release-please, build, build-natives, docker-release]
    steps:
      - name: Cleanup Docker
        uses: geekyeggo/delete-artifact@176a747ab7e287e3ff4787bf8a148716375ca118 # v6
        with:
          name: digests-*
          failOnError: false
      - name: Cleanup Docker 2
        uses: geekyeggo/delete-artifact@176a747ab7e287e3ff4787bf8a148716375ca118 # v6
        with:
          name: "*.dockerbuild"
          failOnError: false
      - name: Cleanup Pages
        uses: geekyeggo/delete-artifact@176a747ab7e287e3ff4787bf8a148716375ca118 # v6
        with:
          name: github-pages*
          failOnError: false
      - name: Cleanup mc-runtime-test
        uses: geekyeggo/delete-artifact@176a747ab7e287e3ff4787bf8a148716375ca118 # v6
        with:
          name: mcrt-*
          failOnError: false
      - name: Merge Artifacts
        uses: actions/upload-artifact/merge@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          delete-merged: true

  release:
    runs-on: ubuntu-latest
    if: needs.release-please.outputs.release_created == 'true'
    needs: [release-please, merge, docker-build]
    permissions:
      contents: write
    steps:
      - name: Download HeadlessMc Launcher Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      - name: Display structure of downloaded files
        run: ls -R
      - name: Upload release assets
        # the release itself (tag and notes) has been created by release-please
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh release upload "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
            ./headlessmc-application/build/quarkus-build/gen/headlessmc.jar \
            ./headlessmc-lwjgl/build/libs/headlessmc-lwjgl-*-all.jar \
            ./headlessmc-lwjgl/build/noasm/headlessmc-lwjgl-*-no-asm.jar \
            ./headlessmc-launcher-linux-x64 \
            ./headlessmc-launcher-windows-x64.exe \
            ./headlessmc-launcher-macos-x64 \
            ./headlessmc-launcher-linux-arm64 \
            ./headlessmc-launcher-macos-arm64
