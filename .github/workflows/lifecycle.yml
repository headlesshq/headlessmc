name: Lifecycle

"on":
  push:
    branches:
      - main
    tags:
      - '**'
  pull_request:
    types:
      #- closed
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

concurrency: # FIXME: prevent release commit cancellation
  group: >
    ${{ github.workflow }}-
    ${{ github.event_name }}-
    ${{ github.event.inputs.ref || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY_IMAGE: 3arthqu4ke/headlessmc

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Coverage
        run: ./gradlew jacocoRootReport --stacktrace

      - name: Add coverage to PR
        if: github.event_name == 'pull_request'
        id: jacoco
        uses: madrapps/jacoco-report@v1.8.0
        with:
          paths: |
            ${{ github.workspace }}/**/build/reports/jacoco/jacocoRootReport/jacocoRootReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 40
          min-coverage-changed-files: 60

      - name: Build
        if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
        run: ./gradlew build --stacktrace

      - name: Upload Test Reports
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore

      #- name: Publish with gradle
      #  if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
      #  env:
      #    IS_MAVEN_PUB: true
      #    DEPLOY_TO_GITHUB_PACKAGES_URL: https://maven.pkg.github.com/headlesshq/headlessmc
      #    GITHUB_USER: ${{ github.actor }}
      #    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #  run: ./gradlew publish

      - name: Build uber jar
        run: ./gradlew :headlessmc-application:quarkusBuild -Dquarkus.package.jar.type=uber-jar

      - name: Rename uber jar
        run: mv headlessmc-application/build/quarkus-build/gen/headlessmc-application-*.jar headlessmc-application/build/quarkus-build/gen/headlessmc.jar

      - name: Publish Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: HeadlessMc Launcher files
          path: |
            ./headlessmc-application/build/quarkus-build/gen/headlessmc.jar
            ./headlessmc-lwjgl/build/libs/headlessmc-lwjgl-*-all.jar
            ./headlessmc-lwjgl/build/noasm/headlessmc-lwjgl-*-no-asm.jar

      - uses: actions/setup-python@v7
        with:
          python-version: 3.x
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV
      - uses: actions/cache@v6
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-
      - run: pip install mkdocs-material
      - name: Build documentation
        run: mkdocs build -d _site

      # Prepare Site deployment
      #- name: Copy javadoc
      #  if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main')
      #  run: cp -r build/docs/javadoc/ _site/
      - name: Rename report dir
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main')
        run: mv build/reports/jacoco/jacocoRootReport/html build/reports/jacoco/jacocoRootReport/coverage
      - name: Copy coverage
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main')
        run: cp -r build/reports/jacoco/jacocoRootReport/coverage/ _site/
      - name: Upload Web page artifact
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main')
        uses: actions/upload-pages-artifact@v5.0.0

  deploy-pages:
    # startsWith(github.ref, 'refs/tags/') || we do not allow tags to deploy github pages
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main')
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: github-pages
          path: .
      - name: Display structure of downloaded files
        run: ls -R
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  build-natives:
    runs-on: ${{ matrix.os.os }}
    strategy:
      matrix:
        os:
          - { os: windows-latest, name: headlessmc-launcher-windows-x64}
          - { os: ubuntu-latest, name: headlessmc-launcher-linux-x64 }
          #- { os: windows-11-arm, name: headlessmc-launcher-windows-arm64 } no graalvm for windows arm64 :(
          - { os: ubuntu-24.04-arm, name: headlessmc-launcher-linux-arm64 }
        # macOS builds take verrryyy long, so I only want to do this on release
        include: ${{ fromJSON(github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main') && '[{"os":{"os":"macos-15-intel","name":"headlessmc-launcher-macos-x64"\}\},{"os":{"os":"macos-latest","name":"headlessmc-launcher-macos-arm64"\}\}]' || '[]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Output Graal Info
        run: |
          echo "GRAALVM_HOME: $GRAALVM_HOME"
          echo "JAVA_HOME: $JAVA_HOME"
          java --version
          native-image --version

      - name: Grant execute permission for gradlew
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Grant execute permission for script
        if: runner.os != 'Windows'
        run: chmod +x scripts/build-native.sh

      - name: Build with Script
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            sudo sysctl -w kern.maxfiles=524288
            sudo sysctl -w kern.maxfilesperproc=524288
            sudo launchctl limit maxfiles 524288 524288
            ulimit -n 524288
          fi
          bash scripts/build-native.sh

      - name: List files
        if: runner.os != 'Windows'
        run: ls headlessmc-application/build

      - name: Rename executable
        if: runner.os != 'Windows'
        run: mv headlessmc-application/build/headlessmc-application-*-runner headlessmc-application/build/${{ matrix.os.name }}

      - name: Rename executable
        if: runner.os == 'Windows'
        run: Move-Item "headlessmc-application/build/headlessmc-application-*-runner.exe" "headlessmc-application/build/${{ matrix.os.name }}.exe"

      - name: Smoke test executable
        shell: bash
        run: |
          EXE="headlessmc-application/build/${{ matrix.os.name }}"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            EXE="$EXE.exe"
          else
            chmod +x "$EXE"
          fi
          "$EXE" help

      - name: Publish Artifact
        uses: actions/upload-artifact@v7
        with:
          name: HeadlessMc Native Image ${{ matrix.os.name }}
          path: |
            ./headlessmc-application/build/${{ matrix.os.name }}*

  docker-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    steps:
      - uses: actions/checkout@v6
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV          

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: |
          github.event_name == 'push' &&
          (
            startsWith(github.ref, 'refs/tags/') ||
            github.ref == 'refs/heads/main'
          )
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # TODO: actually we could just include the uber-jar from the build job
      # TODO: even better, we could just build a native Docker image?
      - name: Build quick
        run: ./gradlew :headlessmc-application:quarkusBuild --stacktrace

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./headlessmc-application
          file: ./headlessmc-application/src/main/docker/Dockerfile.jvm
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=${{ github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main') }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"          

      - name: Upload digest
        if: |
          github.event_name == 'push' &&
          (
            startsWith(github.ref, 'refs/tags/') ||
            github.ref == 'refs/heads/main'
          )
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-release:
    if: |
      github.event_name == 'push' &&
      (
        startsWith(github.ref, 'refs/tags/') ||
        github.ref == 'refs/heads/main'
      )
    runs-on: ubuntu-latest
    needs: [ docker-build, build, build-natives]
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: type=raw,value=${{ github.ref_name == 'main' && 'latest' || github.ref_name }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)          

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:${{ steps.meta.outputs.version }}       

  merge:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [build, build-natives]
    steps:
      - name: Cleanup Docker
        uses: geekyeggo/delete-artifact@v6
        with:
          name: digests-*
          failOnError: false
      - name: Cleanup Docker 2
        uses: geekyeggo/delete-artifact@v6
        with:
          name: "*.dockerbuild"
          failOnError: false
      - name: Cleanup Pages
        uses: geekyeggo/delete-artifact@v6
        with:
          name: github-pages*
          failOnError: false
      - name: Cleanup mc-runtime-test
        uses: geekyeggo/delete-artifact@v6
        with:
          name: mcrt-*
          failOnError: false
      - name: Merge Artifacts
        uses: actions/upload-artifact/merge@v7
        with:
          delete-merged: true

  release:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [merge, docker-build]
    permissions:
      contents: write
    steps:
      - name: Download HeadlessMc Launcher Artifact
        uses: actions/download-artifact@v8
      - name: Display structure of downloaded files
        run: ls -R
      - name: Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          #draft: true
          generate_release_notes: true
          files: |
            ./headlessmc-application/build/quarkus-build/gen/headlessmc.jar
            ./headlessmc-lwjgl/build/libs/headlessmc-lwjgl-*-all.jar
            ./headlessmc-lwjgl/build/noasm/headlessmc-lwjgl-*-no-asm.jar
            ./headlessmc-launcher-linux-x64
            ./headlessmc-launcher-windows-x64.exe
            ./headlessmc-launcher-macos-x64
            ./headlessmc-launcher-linux-arm64
            ./headlessmc-launcher-macos-arm64
