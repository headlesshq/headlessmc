name: MC-Runtime-Test all versions

"on":
  workflow_dispatch:
    inputs:
      mcrt-ref:
        description: Git ref of headlesshq/mc-runtime-test to take the ci-data.json and the action from
        default: 286a6d64008be90fc82f8ffadb8f111adab6907e
      versions:
        description: Comma-delimited Minecraft versions to run (e.g. 1.20.4,1.21.1), or all
        default: all
      xvfb:
        description: >-
          Run with xvfb, headless (-lwjgl with the lwjgl patcher), pre (-lwjgl with the opt-in patched LWJGL,
          --patchers lwjgl-pre), both (xvfb and headless) or all
        type: choice
        default: all
        options:
          - all
          - both
          - xvfb
          - headless
          - pre
  pull_request:
    paths:
      - .github/workflows/mc-runtime-test-all.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MCRT_REF: ${{ inputs.mcrt-ref || '286a6d64008be90fc82f8ffadb8f111adab6907e' }}

jobs:
  build:
    name: Build HeadlessMc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: 25
          distribution: temurin
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Build uber jar
        run: ./gradlew :headlessmc-application:quarkusBuild -Dquarkus.package.jar.type=uber-jar --stacktrace

      - name: Rename uber jar
        run: mv headlessmc-application/build/quarkus-build/gen/headlessmc-application-*.jar headlessmc.jar

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: headlessmc-all-versions
          path: headlessmc.jar
          retention-days: 1

      # the pre runs use the patched LWJGL of the locked headlessmc-lwjgl release: it is downloaded and verified once,
      # cached across workflow runs by the lock file, and put into the HeadlessMc cache of every run
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: patched-lwjgl-cache
          key: patched-lwjgl-${{ hashFiles('headlessmc-patcher/headlessmc-patcher-lwjgl-patched/src/main/resources/patcher/lwjgl-patched/headlessmc-lwjgl.json') }}

      - name: Download the locked patched LWJGL
        run: >-
          python3 -I .github/scripts/download_patched_lwjgl.py
          headlessmc-patcher/headlessmc-patcher-lwjgl-patched/src/main/resources/patcher/lwjgl-patched/headlessmc-lwjgl.json
          patched-lwjgl-cache

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: patched-lwjgl-cache
          path: patched-lwjgl-cache
          retention-days: 1

  matrix:
    name: Construct matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: headlesshq/mc-runtime-test
          ref: ${{ env.MCRT_REF }}
          sparse-checkout: ci-data.json
          sparse-checkout-cone-mode: false

      - id: matrix
        name: Construct matrix
        env:
          VERSIONS: ${{ inputs.versions || 'all' }}
          XVFB: ${{ inputs.xvfb || 'all' }}
        shell: python
        run: |
          import json
          import os

          with open('ci-data.json') as f:
              run_data = json.load(f)['run_data']

          versions = [v.strip() for v in os.environ['VERSIONS'].split(',') if v.strip()]
          if 'all' not in versions:
              run_data = [entry for entry in run_data if entry['mc'] in versions]

          modes = {
              'all': ['xvfb', 'headless', 'pre'],
              'both': ['xvfb', 'headless'],
              'xvfb': ['xvfb'],
              'headless': ['headless'],
              'pre': ['pre'],
          }[os.environ['XVFB']]
          include = [
              {
                  'mc': entry['mc'],
                  'type': entry['type'],
                  'modloader': entry['modloader'],
                  'java': entry['java'],
                  'mode': mode,
              }
              for entry in run_data
              for mode in modes
          ]

          if not include:
              raise SystemExit(f"No versions in ci-data.json match {os.environ['VERSIONS']}")

          print(json.dumps(include, indent=2))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
              fh.write(f"matrix={json.dumps({'include': include})}\n")

  run:
    name: ${{ matrix.mc }} ${{ matrix.type }} ${{ matrix.mode }}
    needs: [ build, matrix ]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    steps:
      # checked out into a sub directory to use the action of the same ref as the ci-data.json
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: headlesshq/mc-runtime-test
          ref: ${{ env.MCRT_REF }}
          path: mc-runtime-test

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin

      # with download-hmc: false the action expects headlessmc.jar in the working directory
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: headlessmc-all-versions
          path: .

      # HeadlessMc finds the jars in its cache, HMC_FILES_LOCATION/cache, and does not download them
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: ${{ matrix.mode == 'pre' }}
        with:
          name: patched-lwjgl-cache
          path: HeadlessMC/cache/lwjgl-patched

      - name: Run the MC client
        timeout-minutes: 10
        uses: ./mc-runtime-test
        with:
          mc: ${{ matrix.mc }}
          modloader: ${{ matrix.modloader }}
          java: ${{ matrix.java }}
          # downloads the prebuilt mc-runtime-test jar from the mc-runtime-test release
          mc-runtime-test: ${{ matrix.type }}
          # the action adds -lwjgl itself when xvfb is false
          xvfb: ${{ matrix.mode == 'xvfb' }}
          cache-mc: github
          download-hmc: false
          headlessmc-command: >-
            ${{ matrix.mode == 'pre' && '--patchers lwjgl-pre' || '' }} --retries 3 --jvm -Djava.awt.headless=true

      - name: Check that the patched LWJGL came from the cache
        if: ${{ always() && matrix.mode == 'pre' }}
        run: |
          if grep -h "Requesting https://github.com/headlesshq/headlessmc-lwjgl/" HeadlessMC/logs/*.log; then
            echo "::error::HeadlessMc downloaded the patched LWJGL instead of using the cached jars"
            exit 1
          fi

      - name: Upload crash reports and logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: logs-${{ matrix.mc }}-${{ matrix.type }}-${{ matrix.mode }}
          path: |
            run/crash-reports/**
            run/logs/**
            run/hs_err_pid*.log
            HeadlessMC/logs/**
          if-no-files-found: ignore
          retention-days: 7
