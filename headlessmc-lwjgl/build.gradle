// TODO: shadowJar with ASM, and jar without ASM!
plugins {
    id("com.gradleup.shadow") version "9.6.1"
}

compileJava {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

sourceSets {
    mock
    java9 {
        java {
            srcDirs = ['src/java9/java']
        }
    }
}

sourceSets.java9.compileClasspath += sourceSets.main.output
sourceSets.java9.compileClasspath += sourceSets.main.compileClasspath

sourceSets.main.compileClasspath += sourceSets.mock.output

dependencies {
    api libs.asm
    api libs.asm.tree
    // the root build excludes jspecify from this module so it stays out of the shaded jar,
    // tests are still @NullMarked though.
    testImplementation libs.jspecify
}

def compileModuleInfo = tasks.named('compileJava9Java', JavaCompile) {
    dependsOn compileJava
    destinationDirectory = layout.buildDirectory.dir('classes/module-info-java9')
    options.release = 9
    modularity.inferModulePath = false
    classpath = files()
    doFirst {
        options.compilerArgs = [
                '--module-path', configurations.compileClasspath.asPath,
                '--patch-module', "io.github.headlesshq.headlessmc.lwjgl=${sourceSets.main.output.asPath}",
        ]
    }
}

jar {
    manifest {
        attributes 'TweakClass': 'io.github.headlesshq.headlessmc.lwjgl.launchwrapper.LwjglTweaker'
        attributes 'Premain-Class': 'io.github.headlesshq.headlessmc.lwjgl.agent.LwjglAgent'
        attributes 'Agent-Class': 'io.github.headlesshq.headlessmc.lwjgl.agent.LwjglAgent'
        attributes 'Can-Redefine-Classes': true
        attributes 'Can-Retransform-Classes': true
        attributes 'Multi-Release': true
        attributes 'Implementation-Title': 'headlessmc-lwjgl'
        attributes 'Implementation-Version': project.version
        attributes 'Implementation-Vendor': 'HeadlessHQ'
    }

    into('META-INF/versions/9') {
        from(compileModuleInfo.map { it.destinationDirectory }) {
            include 'module-info.class'
        }
    }
}

shadowJar {
    dependsOn compileModuleInfo
    exclude { it.relativePath.pathString == 'module-info.class' }
    doLast {
        // TODO: don't use Ant for this...
        ant.zip(destfile: archiveFile.get().asFile, update: true) {
            zipfileset(
                    dir: compileModuleInfo.get().destinationDirectory.get().asFile,
                    prefix: 'META-INF/versions/9', includes: 'module-info.class'
            )
        }
    }
}

// The menu hook also runs with vanilla, which provides no ASM. Keep its ASM
// private so Fabric does not see a second copy of the loader's ASM packages.
tasks.register('macosMenuAgentJar', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
    archiveFileName = 'headlessmc-macos-menu-agent.jar'

    configurations = [project.configurations.runtimeClasspath]

    from(sourceSets.main.output) {
        include 'io/github/headlesshq/headlessmc/lwjgl/agent/MacosMenuAgent.class'
        include 'io/github/headlesshq/headlessmc/lwjgl/transformer/MacosMenuTransformer.class'
    }

    relocate 'org.objectweb.asm', 'io.github.headlesshq.headlessmc.lwjgl.agent.asm'
    relocate 'io.github.headlesshq.headlessmc.lwjgl.agent.MacosMenuAgent', 'io.github.headlesshq.headlessmc.lwjgl.agent.macos.MacosMenuAgent'
    relocate 'io.github.headlesshq.headlessmc.lwjgl.transformer', 'io.github.headlesshq.headlessmc.lwjgl.agent.macos'
    manifest {
        attributes 'Premain-Class': 'io.github.headlesshq.headlessmc.lwjgl.agent.macos.MacosMenuAgent'
    }

    exclude { it.relativePath.pathString == 'module-info.class' }
}

// https://github.com/headlesshq/headlessmc/issues/199
// fabric 0.16.2+ doesn't like multiple asm versions in the classpath
tasks.register('noAsmJar', Copy) {
    dependsOn jar
    from jar.archiveFile
    into layout.buildDirectory.dir('noasm')
    rename { fileName ->
        fileName.replace("-${version}.jar", "-${version}-no-asm.jar")
    }
}

build.dependsOn(noAsmJar)

tasks.register('testAgent', Test) {
    dependsOn jar
    group = 'verification'
    useJUnitPlatform()
    testLogging {
        events "failed"
        exceptionFormat "full"
    }

    jvmArgs = [
            "-javaagent:$projectDir/build/libs/headlessmc-lwjgl-${rootProject.version}.jar",
            "-Dhmc.lwjgl.agenttest=true"
    ]

    filter {
        includeTestsMatching "io.github.headlesshq.headlessmc.lwjgl.agent.AgentTest"
    }
}

test.finalizedBy(testAgent)
