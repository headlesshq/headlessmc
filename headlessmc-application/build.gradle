plugins {
    alias libs.plugins.quarkus
}

// -PuberJar builds the uber-jar for this module only, unlike -Dquarkus.package.jar.type=uber-jar,
// which applies to every Quarkus module of the build and breaks e.g. headlessmc-platform-util
if (providers.gradleProperty('uberJar').present) {
    quarkus {
        set('package.jar.type', 'uber-jar')
    }
}

// -PmutableJar builds the mutable-jar, which keeps the deployment dependencies,
// so that it can be re-augmented with the plugin jars placed in quarkus-app/providers.
if (providers.gradleProperty('mutableJar').present) {
    quarkus {
        set('package.jar.type', 'mutable-jar')
        set('package.jar.user-providers-directory', 'providers')
    }

    // The Quarkus Gradle plugin assembles build/quarkus-app as a fast-jar and drops lib/deployment,
    // so we zip the complete mutable-jar Quarkus generated in quarkus-build/gen instead.
    tasks.register('mutableJarZip', Zip) {
        dependsOn quarkusBuild
        group = 'build'
        from(layout.buildDirectory.dir('quarkus-build/gen/quarkus-app')) {
            into 'quarkus-app'
        }
        archiveFileName = 'headlessmc-mutable.zip'
        destinationDirectory = layout.buildDirectory
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }

    // Writes the lock for the mutable-jar, which the builds of the uber-jar and native image
    // embed with -PmutableJarLock=<file>, so that they can download and verify the mutable-jar.
    def releaseVersion = version
    tasks.register('mutableJarLock') {
        def zip = tasks.named('mutableJarZip', Zip).flatMap { it.archiveFile }
        def lock = layout.buildDirectory.file('headlessmc-mutable.properties')
        inputs.file(zip)
        outputs.file(lock)
        group = 'build'
        doLast {
            File zipFile = zip.get().asFile
            def sha256 = java.security.MessageDigest.getInstance('SHA-256').digest(zipFile.bytes).encodeHex().toString()
            lock.get().asFile.text = """\
                version=${releaseVersion}
                sha256=${sha256}
                size=${zipFile.length()}
                url=https://github.com/headlesshq/headlessmc/releases/download/${releaseVersion}/headlessmc-mutable.zip
                """.stripIndent()
        }
    }
}

// Generates META-INF/headlessmc/core-libraries.txt, the libraries plugins cannot replace,
// and META-INF/headlessmc/mutable-jar.properties if -PmutableJarLock=<file> is given.
def mutableJarLock = providers.gradleProperty('mutableJarLock').map { rootProject.file(it) }
def coreLibraries = configurations.runtimeClasspath.incoming.artifacts.resolvedArtifacts.map { artifacts ->
    artifacts.collect { it.id.componentIdentifier }
        .findAll { it instanceof ModuleComponentIdentifier }
        .collect { "${it.group}:${it.module}:${it.version}".toString() }
        .unique()
        .sort()
}
def generateHeadlessMcResources = tasks.register('generateHeadlessMcResources') {
    def outputDir = layout.buildDirectory.dir('generated/resources/headlessmc')
    inputs.property('coreLibraries', coreLibraries)
    inputs.files(mutableJarLock.map { [it] }.orElse([])).optional()
    outputs.dir(outputDir)
    doLast {
        File dir = outputDir.get().dir('META-INF/headlessmc').asFile
        dir.deleteDir()
        dir.mkdirs()
        new File(dir, 'core-libraries.txt').text = coreLibraries.get().join('\n') + '\n'
        if (mutableJarLock.present) {
            new File(dir, 'mutable-jar.properties').bytes = mutableJarLock.get().bytes
        }
    }
}

sourceSets.main.resources.srcDir(generateHeadlessMcResources)

// quarkusDev is not that great, especially if we want to debug from the shell
// quarkusRun is not a JavaExec, so IntelliJ cannot attach a debugger
// the gradle application plugin run task somehow also runs quarkusDev
// so we created this task which runs the quarkus-run.jar
tasks.register("runApp", JavaExec) {
    dependsOn quarkusBuild
    group = "other"
    classpath = files(project.layout.buildDirectory.file("quarkus-app/quarkus-run.jar"))
    // Add-Opens: java.base/java.lang java.base/java.nio java.base/jdk.internal.misc
    jvmArgs += ["--add-opens", "java.base/java.lang=ALL-UNNAMED"]
    mainClass = "io.quarkus.bootstrap.runner.QuarkusEntryPoint"
    standardInput = System.in
}

// Attaches the uber-jar to the publication as io.github.headlesshq:headlessmc-application:<version>:runner.
// -PapplicationJar=<path> attaches an already built jar, e.g. the headlessmc.jar of a GitHub release,
// so that Maven Central and the GitHub release contain the same bytes.
// Otherwise, -PuberJar attaches the uber-jar built by quarkusBuild.
def applicationJar = providers.gradleProperty('applicationJar')
if (applicationJar.present || providers.gradleProperty('uberJar').present) {
    publishing.publications.named('mavenJava', MavenPublication) {
        if (applicationJar.present) {
            artifact(file(applicationJar.get())) {
                classifier = 'runner'
            }
        } else {
            artifact(layout.buildDirectory.file("headlessmc-application-${version}-runner.jar")) {
                classifier = 'runner'
                builtBy quarkusBuild
            }
        }
    }
}

dependencies {
    implementation platform(libs.quarkus)
    implementation libs.quarkus.arc
    implementation libs.quarkus.picocli
    //implementation libs.slf4j.jboss
    api project(':headlessmc-bom')

    testImplementation project(':headlessmc-console:headlessmc-console-completions')
}
