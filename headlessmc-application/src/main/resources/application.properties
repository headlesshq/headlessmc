quarkus.banner.enabled=false
quarkus.log.level=WARNING

# The root level is lowered to hmc.log.file-level once the log file is opened, see LoggingInitializer.
# java.lang.ProcessBuilder logs a synthetic stacktrace for every process that is started at DEBUG,
# which jline does often enough to bury everything else in the log file.
quarkus.log.category."java.lang.ProcessBuilder".level=INFO

# The core libraries and the mutable jar lock are read by headlessmc-plugins, see generateHeadlessMcResources.
quarkus.native.resources.includes=META-INF/headlessmc/**

# Used by scripts/build-native.sh and by 'plugin compile', which compiles native images with plugins.
# -H:-ParseRuntimeOptions: HeadlessMcMain parses system properties itself, see HeadlessMcMain#parseSystemProperties.
quarkus.native.additional-build-args=--initialize-at-run-time=org.jline.nativ,\
  --initialize-at-run-time=org.jline.terminal.impl.ffm,\
  -H:+UnlockExperimentalVMOptions,-H:-ParseRuntimeOptions,-H:+SharedArenaSupport,-H:-UnlockExperimentalVMOptions
