# Chinese (Simplified) texts for the HeadlessMc picocli commands.
#
# Picocli resolves a text by trying "<qualified command name>.<key>" first and
# falls back to "<key>", where <key> is:
#   - "usage.description" for a command's description
#   - the option name without leading dashes for an option's description
# The qualified name is the command names joined with '.', starting at the root
# command, e.g. headlessmc.mod.add. Aliases share the description of their
# command, so no separate keys are needed for them.
# Keys missing here fall back to the text given in the annotation, so a partial
# translation degrades to English instead of failing.
#
# The bundle is selected by the locale from hmc.i18n.locale.

# === Standard help options, shared by every command ===
