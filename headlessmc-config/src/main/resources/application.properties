# suppress inspection "UnusedProperty" for whole file
# Default values for all HeadlessMc config properties.
# Optional properties without a default are commented out.

# === Net (hmc.net) ===
#hmc.net.http-version=HTTP_1_1
hmc.net.cookies=true
#hmc.net.user-agent=HeadlessMc/<version> default value set in ConfigMapping
hmc.net.delete-failed-files=true
hmc.net.retries=1

# === Updater (hmc.updater) ===
hmc.updater.enabled=true
hmc.updater.repository=headlesshq/headlessmc
hmc.updater.timeout-ms=3000
hmc.updater.interval-hours=24

# === Java (hmc.java) ===
#hmc.java.versions=
hmc.java.fail-on-parsing-failure=false
hmc.java.download=true
hmc.java.max-scan-depth=6
hmc.java.check-for-updates=true

# === Directories (hmc.files) ===
#hmc.files.mc=
#hmc.files.mc-folders=
#hmc.files.game=
hmc.files.game-for-each-version=true

# === Logging (hmc.log) ===
hmc.log.file=true
hmc.log.file-name=headlessmc.log
hmc.log.console-level=WARN
hmc.log.file-level=DEBUG
hmc.log.stacktraces=false
hmc.log.max-file-size=10M
hmc.log.max-backups=5
hmc.logging.patch=true

# === CPU (hmc.cpu) ===
#hmc.cpu.arch=
#hmc.cpu.bitness=

# === OS (hmc.os) ===
#hmc.os.name=
#hmc.os.type=
#hmc.os.version=
#hmc.os.actual-type=

# === Parallel downloads (hmc.parallel) ===
# Also used nested under hmc.assets.parallel and hmc.libraries.parallel.
hmc.parallel.parallelism=6
hmc.parallel.retry-max-attempts=4
hmc.parallel.retry-initial-interval-ms=250
hmc.parallel.retry-back-off-factor=2.0
hmc.parallel.retry-jitter=0.5
hmc.parallel.retry-max-interval-ms=2000
hmc.parallel.rate-limit-permits=200
hmc.parallel.rate-limit-refresh-period-seconds=1
hmc.parallel.rate-limit-timeout-seconds=30
hmc.parallel.breaker-failure-rate-threshold=50.0
hmc.parallel.breaker-sliding-window-size=32
hmc.parallel.breaker-minimum-calls=8
hmc.parallel.breaker-open-wait-ms=5000
hmc.parallel.breaker-half-open-calls=4

# === Libraries (hmc.libraries) ===
# Libraries use a nested parallel config (hmc.libraries.parallel.*):
#   hmc.libraries.parallel.parallelism=1

# === Assets (hmc.assets) ===
hmc.assets.dummy=false
hmc.assets.url=https://resources.download.minecraft.net
# Assets use a nested net config (hmc.assets.net.*):
#   hmc.assets.net.retries=0
#   hmc.assets.net.cookies=true

# === Jline ===
hmc.jline.enabled=true
hmc.jline.ansi-colors=false
hmc.jline.persistent-completions=true

# === hmc-specifics ===
# Passed to the game as SystemProperties if they deviate from these defaults, see SpecificsProperty.
# hmc.jline.enabled from above is passed, too.
hmc.jline.dumb=false
hmc.debug.jline=false
hmc.account.refresh.enabled=true
hmc.account.refresh.interval=82800
hmc.resourcepacks.autoaccept=false
hmc.log4jappender.ansi=true
hmc.adventure.enabled=true
hmc.adventure.output.throwables=true
hmc.adventure.color.none=false

# === XVFB ===
hmc.xvfb.check=false
