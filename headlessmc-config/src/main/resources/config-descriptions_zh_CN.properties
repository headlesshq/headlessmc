# suppress inspection "UnusedProperty" for whole file

# Chinese (Simplified) descriptions for the properties in config-descriptions.properties.
# Keys missing here fall back to the English description in config-descriptions.properties.
# The file is selected by the locale from hmc.i18n.locale.

# === Net ===
hmc.net.http-version=下载时使用的 HTTP 版本（HTTP_1_1、HTTP_2、HTTP_3）。不设置则由客户端决定。
hmc.net.cookies=是否为下载保留 Cookie。
hmc.net.user-agent=请求中发送的 User-Agent。
hmc.net.delete-failed-files=下载失败时是否删除已部分下载的文件。
hmc.net.retries=每次下载的重试次数（0 表示不重试）。

# === Updater ===
hmc.updater.enabled=启动命令行、输出版本或运行耗时较长的命令时，各更新检查器（例如 HeadlessMc 新版本）是否检查更新。
hmc.updater.repository=用于检查新版本的 GitHub 仓库（owner/repo）。
hmc.updater.timeout-ms=检查新版本时的超时时间（毫秒）。
hmc.updater.interval-hours=在运行耗时较长的命令（如 launch 或 install）之前，更新检查器在多少小时后重新请求远程来源，而不是使用缓存的结果。

# === Java ===
hmc.java.versions=用户指定的 Java 安装路径。
hmc.java.fail-on-parsing-failure=解析某个 Java 安装失败时，是中止还是跳过它。
hmc.java.download=是否允许自动下载缺失的 Java 版本。
hmc.java.max-scan-depth=扫描 Java 安装目录的最大深度。
hmc.java.check-for-updates=Java 更新检查器是否检查由 HeadlessMc 安装的 Java 是否有更新，另见 hmc.updater.enabled。

# === Directories ===
hmc.files.mc=Minecraft 目录的路径。默认为操作系统的默认位置。
hmc.files.game=游戏目录的路径。默认为 Minecraft 目录下按版本划分的目录。
hmc.files.game-for-each-version=是否为每个版本使用独立的游戏目录。
hmc.files.location=指定存放 HeadlessMc 文件的自定义位置。

# === I18n ===
hmc.i18n.locale=用于本地化文本的区域设置，例如 zh_CN。auto 表示跟随 JVM 的默认区域设置，没有对应翻译时回退到英文。
