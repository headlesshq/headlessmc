# suppress inspection "UnusedProperty" for whole file

# === Net ===
hmc.net.http-version=HTTP version to use for downloads (HTTP_1_1, HTTP_2, HTTP_3). Unset lets the client decide.
hmc.net.cookies=Whether to keep a cookie store for downloads.
hmc.net.user-agent=User-Agent header sent with requests.
hmc.net.delete-failed-files=Whether a partially downloaded file is deleted when the download fails.
hmc.net.retries=Number of retries per download (0 disables retrying).

# === Java ===
hmc.java.versions=Paths to Java installations specified by the user.
hmc.java.fail-on-parsing-failure=Whether parsing a Java installation that fails should abort instead of being skipped.
hmc.java.download=Whether missing Java versions may be downloaded automatically.
hmc.java.max-scan-depth=How deep to scan Java installation directories.

# === Directories ===
hmc.files.mc=Path to the Minecraft directory. Defaults to the OS-specific location.
hmc.files.game=Path to the game directory. Defaults to a per-version directory inside the Minecraft directory.
hmc.files.game-for-each-version=Whether each version gets its own game directory.
hmc.files.location=Specify a custom location to place HeadlessMc files in.

# === Logging ===
hmc.log.file=Whether HeadlessMc writes a log file into the logs directory.
hmc.log.file-name=Name of the log file inside the logs directory.
hmc.log.console-level=Minimum level a message needs to be printed to the console.
hmc.log.file-level=Minimum level a message needs to end up in the log file. Levels below quarkus.log.min-level are never recorded.
hmc.log.stacktraces=Whether the console prints full stacktraces instead of just the message of an exception and its causes. The log file always contains full stacktraces.
hmc.log.max-file-size=Size the log file may reach before it is rotated, e.g. 10M.
hmc.log.max-backups=How many rotated log files are kept.
hmc.log.patch=Patches the XML output of logging.xml files

# === CPU ===
hmc.cpu.arch=Overrides the detected CPU architecture.
hmc.cpu.bitness=Overrides the detected CPU bitness.

# === OS ===
hmc.os.name=Overrides the detected operating system name.
hmc.os.type=Overrides the detected operating system type.
hmc.os.version=Overrides the detected operating system version.
hmc.os.actual-type=Overrides the actual operating system type used for launching.

# === Parallel downloads ===
hmc.parallel.parallelism=Maximum number of tasks in progress at once (0 means one worker per task).
hmc.parallel.retry-max-attempts=Total number of attempts per task, including the initial attempt.
hmc.parallel.retry-initial-interval-ms=Base delay in milliseconds before the first retry.
hmc.parallel.retry-back-off-factor=Multiplier applied to the retry delay after each failed attempt.
hmc.parallel.retry-jitter=Randomization factor (0.0-1.0) applied to each retry delay.
hmc.parallel.retry-max-interval-ms=Upper bound in milliseconds for a single retry delay.
hmc.parallel.rate-limit-permits=Number of attempts allowed during each rate limit refresh period.
hmc.parallel.rate-limit-refresh-period-seconds=Length of one rate limit refresh period in seconds.
hmc.parallel.rate-limit-timeout-seconds=Maximum time in seconds a worker may wait for a rate limit permit.
hmc.parallel.breaker-failure-rate-threshold=Failure rate in percent at which the shared circuit breaker opens.
hmc.parallel.breaker-sliding-window-size=Number of most recent calls used to calculate the failure rate.
hmc.parallel.breaker-minimum-calls=Minimum number of calls required before the failure rate is evaluated.
hmc.parallel.breaker-open-wait-ms=Time in milliseconds the circuit breaker stays open before probing again.
hmc.parallel.breaker-half-open-calls=Number of probe calls allowed while the circuit breaker is half-open.

# === Assets ===
hmc.assets.dummy=Whether to write dummy asset files instead of downloading real assets.
hmc.assets.url=Base URL of the asset CDN.

# === Libraries ===
# Libraries only expose a nested parallel config (hmc.libraries.parallel.*), see hmc.parallel.* descriptions.

# === Jline ===
hmc.jline.enabled=If Jline terminal support is enabled. Might need to be disabled on termux or in IDE terminals.
hmc.jline.ansi-colors=Allows you to enable colored terminal output, even if the Jline terminal is disabled.
hmc.jline.persistent-completions=Always displays completions when the HeadlessMc shell is used.

# === XVFB ===
hmc.xvfb.check=Whether to check if HeadlessMc is running with XVFB. For CI/CD pipelines.
