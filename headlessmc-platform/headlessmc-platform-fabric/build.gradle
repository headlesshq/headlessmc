    runtimeOnly project(':headlessmc-version:headlessmc-version-jackson')

    //testImplementation libs.fabric
    testImplementation project(':headlessmc-util:headlessmc-util-json-jackson')
}


import groovy.json.JsonOutput
import groovy.json.JsonSlurper

import java.security.MessageDigest

static def hash(File file, String algorithm) {
    MessageDigest digest = MessageDigest.getInstance(algorithm)

    file.withInputStream { input ->
        byte[] buffer = new byte[8192]
        int read

        while ((read = input.read(buffer)) != -1) {
            digest.update(buffer, 0, read)
        }
    }

    digest.digest().collect { String.format("%02x", it) }.join()
}

def fabricArtifactsLockFile = layout.projectDirectory.file("src/main/resources/fabric/fabric-artifacts.json")

/**
 * Resolves the fabric configuration and rewrites the committed lock file.
 * This is the only task that downloads the installers, run it after changing their versions.
 */
tasks.register('updateFabricArtifacts') {
    group = "fabric"
    description = "Resolves the fabric installers and rewrites ${fabricArtifactsLockFile.asFile.name}."
    outputs.upToDateWhen { false }

    doLast {
        def repositoryUrls = repositories
                .withType(MavenArtifactRepository)
                .collectEntries {
                    [(it.name): it.url.toString()]
                }

        def result = [:]
        configurations.fabric.resolvedConfiguration.resolvedArtifacts.forEach { artifact ->
            File file = artifact.file
            def componentId = artifact.moduleVersion.id
            def resolvedComponent = configurations.fabric.incoming.resolutionResult.allComponents.find {
                it.moduleVersion
                        && it.moduleVersion.group == componentId.group
                        && it.moduleVersion.name == componentId.name
                        && it.moduleVersion.version == componentId.version
            }

            def repoUrl = Objects.requireNonNull(repositoryUrls[resolvedComponent.getRepositoryName()])
            def key = "$componentId.group:$componentId.name"
            if (result.containsKey(key)) {
                throw new IllegalStateException("$key already in installer map")
            }

            result[key] = [
                group     : componentId.group,
                name      : componentId.name,
                version   : componentId.version,
                fileName  : file.name,
                size      : file.length(),
                sha256    : hash(file, "SHA-256"),
                repository: repoUrl,
            ]
        }

        File output = fabricArtifactsLockFile.asFile
        output.parentFile.mkdirs()
        output.text = JsonOutput.prettyPrint(JsonOutput.toJson(result)) + "\n"
    }
}

/**
 * Checks that the committed lock file matches the declared fabric dependencies without resolving them.
 */
tasks.register('verifyFabricArtifacts') {
    group = "verification"
    description = "Checks that ${fabricArtifactsLockFile.asFile.name} matches the declared fabric installers."

    def declared = configurations.fabric.dependencies.collectEntries {
        [("$it.group:$it.name".toString()): it.version]
    }

    inputs.property("declared", declared)
    inputs.file(fabricArtifactsLockFile)

    doLast {
        def locked = new JsonSlurper().parse(fabricArtifactsLockFile.asFile).collectEntries { key, value ->
            [(key): value.version]
        }

        if (declared != locked) {
            throw new GradleException("""${fabricArtifactsLockFile.asFile} is out of date.
  declared: $declared
  locked:   $locked
Run './gradlew ${project.path}:updateFabricArtifacts' and commit the result.""")
        }
    }
}

tasks.named("processResources") {
    dependsOn("verifyFabricArtifacts")
}

