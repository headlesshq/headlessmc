org.gradle.parallel=true
org.gradle.jvmargs=-Xmx2G
# Maven Central only requires .md5 and .sha1, the .sha512 files Gradle generates
# by default would add one file per published artifact to the deployment bundle.
systemProp.org.gradle.internal.publish.checksums.insecure=true

# Instead of using XDG locations during development,
# place files relative to this project in the legacy HeadlessMC dir,
# which is easy to .gitignore
hmc.files.location=HeadlessMC

# x-release-please-start-version
version=3.0.0-RC8
# x-release-please-end
