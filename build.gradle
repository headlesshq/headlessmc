plugins {
    id 'java'
    alias(libs.plugins.quarkus)
    alias(libs.plugins.nmcp)
}

def generateVersionSource = tasks.register('generateVersionSource', Sync) {
    inputs.property('version', project.version)
    from('src/main/templates') {
        expand(version: project.version)
    }
    into(layout.buildDirectory.dir('generated/sources/templates/java/main'))
}

sourceSets.main.java.srcDir(generateVersionSource.map { it.destinationDir })

allprojects {
    apply plugin: 'java'
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'
    apply plugin: 'signing'
    apply plugin: 'com.gradleup.nmcp'
    apply plugin: 'jacoco'
    apply plugin: 'jacoco-report-aggregation'
    apply plugin: 'io.quarkus'

    group = 'io.github.headlesshq'

    repositories {
        mavenCentral()
    }

    dependencies {
        if (project.name != 'headlessmc-lwjgl') {
            implementation libs.jspecify
            compileOnly libs.jetbrains.annotations
        }

        compileOnly libs.lombok
        annotationProcessor libs.lombok
        testCompileOnly libs.lombok
        testAnnotationProcessor libs.lombok

        Set<String> baseProjects = new HashSet<>()
        baseProjects.add('headlessmc')
        baseProjects.add('headlessmc-exceptions')
        baseProjects.add('headlessmc-forge-installer')
        baseProjects.add('headlessmc-lwjgl')
        baseProjects.add('headlessmc-lwjgl-transformer')
        baseProjects.add('headlessmc-patcher-probe')
        if (!baseProjects.contains(project.name)) {
            api project(':headlessmc-exceptions')
        }

        testImplementation platform(libs.quarkus)
        testImplementation libs.quarkus.junit

        // maybe just add to project.ext?
        Set<String> java8Projects = new HashSet<>(baseProjects)
        java8Projects.add('headlessmc-console')
        java8Projects.add('headlessmc-console-format')
        java8Projects.add('headlessmc-console-completions')
        java8Projects.add('headlessmc-auth')
        java8Projects.add('headlessmc-auth-all')
        java8Projects.add('headlessmc-auth-impl')
        java8Projects.add('headlessmc-auth-offline')
        java8Projects.add('headlessmc-auth-store-gson')
        java8Projects.add('headlessmc-auth-yggdrasil')
        java8Projects.add('headlessmc-auth-webview')
        java8Projects.add('headlessmc-commands-auth')
        if (!java8Projects.contains(project.name)) {
            implementation platform(libs.quarkus)
            implementation libs.inject
            implementation libs.cdi
            implementation libs.slf4j
            runtimeOnly libs.slf4j.jboss

            testImplementation enforcedPlatform(libs.quarkus)
            testImplementation libs.quarkus.arc
            testImplementation libs.quarkus.core
            testImplementation libs.quarkus.junit.component
            testImplementation libs.quarkus.jacoco

            // TODO: check quarkus jackson-reflection-free-serializers
            // for @RegisterForReflection, could also use graalvm reflect-config for improved compatibility
            compileOnly libs.quarkus.core
        }
    }

    java {
        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
    }

    compileJava {
        options.encoding = 'UTF-8'
        options.compilerArgs << '-parameters'
    }

    compileTestJava {
        options.encoding = 'UTF-8'
        options.release = 25
    }

    test {
        useJUnitPlatform()
        testLogging {
            events "failed", "skipped"
            exceptionFormat "full"
            showCauses true
            showStackTraces true
        }
        if (providers.gradleProperty('hmc.files.location').present) {
            systemProperty 'hmc.files.location', providers.gradleProperty('hmc.files.location').get()
        }

        // Classes loaded by the QuarkusClassLoader are transformed, so the plain jacoco
        // agent records them under mismatched class ids; quarkus-jacoco records them
        // instead, writing into the same exec file (see the Quarkus JaCoCo guide).
        // @QuarkusComponentTest classes are defined by the QuarkusComponentTestClassLoader without
        // a ProtectionDomain, which jacoco skips unless includeNoLocationClasses is set.
        jacoco {
            excludeClassLoaders = ["*QuarkusClassLoader"]
            includeNoLocationClasses = true
        }

        systemProperty 'quarkus.jacoco.data-file', layout.buildDirectory.file('jacoco/test.exec').get().asFile.absolutePath
        systemProperty 'quarkus.jacoco.report', 'false'
        finalizedBy jacocoTestReport
    }

    jacocoTestReport {
        dependsOn test
    }


    java {
        withSourcesJar()
        withJavadocJar()
    }

    def delombok = tasks.register('delombok', JavaExec) {
        def srcDirs = sourceSets.main.java.sourceDirectories
        def outputDir = layout.buildDirectory.dir('delombok')
        inputs.files(srcDirs).skipWhenEmpty()
        outputs.dir(outputDir)
        classpath = configurations.annotationProcessor
        mainClass = 'lombok.launch.Main'
        argumentProviders.add({
            ['delombok', '--quiet', '--encoding', 'UTF-8',
             '--classpath', sourceSets.main.compileClasspath.asPath,
             '-d', outputDir.get().asFile.absolutePath] +
                    srcDirs.files.findAll { it.exists() }.collect { it.absolutePath }
        } as CommandLineArgumentProvider)
    }

    javadoc {
        dependsOn delombok
        source = files(delombok.map { it.outputs.files })
        options.encoding = 'UTF-8'
        options.addStringOption('Xdoclint:none', '-quiet')
        options.addBooleanOption('-no-fonts', true)
        failOnError = false
    }

    def published = project.name != 'headlessmc-docs'

    publishing {
        publications {
            if (published) mavenJava(MavenPublication) {
                from components.java
                versionMapping {
                    usage('java-api') {
                        fromResolutionOf('runtimeClasspath')
                    }
                    usage('java-runtime') {
                        fromResolutionResult()
                    }
                }
                pom {
                    name = project.name
                    description = project.description ?: 'HeadlessMc, a command line launcher for Minecraft Java Edition. Module: ' + project.name
                    url = 'https://github.com/headlesshq/headlessmc'
                    licenses {
                        license {
                            name = 'MIT License'
                            url = 'https://opensource.org/license/mit'
                        }
                    }
                    developers {
                        developer {
                            id = '3arthqu4ke'
                            name = '3arthqu4ke'
                            url = 'https://github.com/3arthqu4ke'
                        }
                        developer {
                            id = 'okafke'
                            name = 'okafke'
                            url = 'https://github.com/okafke'
                        }
                    }
                    scm {
                        connection = 'scm:git:https://github.com/headlesshq/headlessmc.git'
                        developerConnection = 'scm:git:ssh://git@github.com/headlesshq/headlessmc.git'
                        url = 'https://github.com/headlesshq/headlessmc'
                    }
                    issueManagement {
                        system = 'GitHub'
                        url = 'https://github.com/headlesshq/headlessmc/issues'
                    }
                }
            }
        }
        repositories {
            maven {
                url = uri("${project.rootProject.getLayout().buildDirectory.get()}/maven")
            }
        }
    }

    def signingKey = providers.environmentVariable('SIGNING_KEY')
    signing {
        required = signingKey.present
        if (signingKey.present) {
            useInMemoryPgpKeys(signingKey.get(), providers.environmentVariable('SIGNING_PASSWORD').getOrElse(''))
        }
        sign publishing.publications
    }
}

nmcpAggregation {
    centralPortal {
        username = providers.environmentVariable('MAVEN_CENTRAL_USERNAME')
        password = providers.environmentVariable('MAVEN_CENTRAL_PASSWORD')
        // USER_MANAGED: check and publish the deployment manually at https://central.sonatype.com/publishing/deployments
        publishingType = providers.environmentVariable('MAVEN_CENTRAL_PUBLISHING_TYPE').orElse('AUTOMATIC')
        publicationName = "headlessmc-${version}"
        validationTimeout = java.time.Duration.ofMinutes(30)
        // validation passed, Central finishes publishing by itself
        publishingTimeout = java.time.Duration.ZERO
    }
}

// -PmavenCentralProjects=headlessmc-application,... only uploads these projects,
// e.g. to publish an artifact that was missing from an already published (immutable) release
def mavenCentralProjects = providers.gradleProperty('mavenCentralProjects')
    .map { it.split(',').collect { it.trim() }.findAll { !it.isEmpty() } as Set<String> }

dependencies {
    allprojects {
        if (!mavenCentralProjects.present || mavenCentralProjects.get().contains(project.name)) {
            nmcpAggregation(project(path))
        }
    }
}

publish {
    subprojects.each { dependsOn("${it.path}:publish") }
}

compileJava {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
    options.release = 8
}

tasks.register('jacocoRootReport', JacocoReport) {
    group 'verification'
    def coveredProjects = subprojects.findAll { it.plugins.hasPlugin('jacoco') }
    dependsOn coveredProjects.collect { "${it.path}:test" }

    executionData.setFrom(files({
        coveredProjects.collect {
            it.layout.buildDirectory.file('jacoco/test.exec').get().asFile
        }.findAll { it.exists() }
    }))
    sourceDirectories.setFrom(files(coveredProjects.collect { it.sourceSets.main.allSource.srcDirs }))
    classDirectories.setFrom(files(coveredProjects.collect {
        it.fileTree(dir: it.layout.buildDirectory.dir('classes/java/main').get().asFile, exclude: [])
    }))

    reports {
        xml.required = true
        html.required = true
        html.outputLocation = layout.buildDirectory.dir('reports/jacoco/root')
        xml.outputLocation = layout.buildDirectory.file('reports/jacoco/root/jacoco.xml')
    }
}
