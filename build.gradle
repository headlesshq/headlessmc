plugins {
    id 'java'
    alias(libs.plugins.quarkus)
}

def generateVersionSource = tasks.register('generateVersionSource', Sync) {
    inputs.property('version', project.version)
    from('src/main/templates') {
        expand(version: project.version)
    }
    into(layout.buildDirectory.dir('generated/sources/templates/java/main'))
}

sourceSets.main.java.srcDir(generateVersionSource.map { it.destinationDir })

allprojects {
    apply plugin: 'java'
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'
    apply plugin: 'jacoco'
    apply plugin: 'jacoco-report-aggregation'
    apply plugin: 'io.quarkus'

    group = 'io.github.headlesshq'
    version = '3.0.0-RC4'

    repositories {
        mavenCentral()
    }

    dependencies {
        if (project.name != 'headlessmc-lwjgl') {
            implementation libs.jspecify
            compileOnly libs.jetbrains.annotations
        }

        compileOnly libs.lombok
        annotationProcessor libs.lombok
        testCompileOnly libs.lombok
        testAnnotationProcessor libs.lombok

        Set<String> baseProjects = new HashSet<>()
        baseProjects.add('headlessmc')
        baseProjects.add('headlessmc-exceptions')
        baseProjects.add('headlessmc-forge-installer')
        baseProjects.add('headlessmc-lwjgl')
        baseProjects.add('headlessmc-lwjgl-transformer')
        baseProjects.add('headlessmc-patcher-probe')
        if (!baseProjects.contains(project.name)) {
            api project(':headlessmc-exceptions')
        }

        testImplementation platform(libs.quarkus)
        testImplementation libs.quarkus.junit

        // maybe just add to project.ext?
        Set<String> java8Projects = new HashSet<>(baseProjects)
        java8Projects.add('headlessmc-console')
        java8Projects.add('headlessmc-console-format')
        java8Projects.add('headlessmc-auth')
        java8Projects.add('headlessmc-auth-all')
        java8Projects.add('headlessmc-auth-impl')
        java8Projects.add('headlessmc-auth-offline')
        java8Projects.add('headlessmc-auth-store-gson')
        java8Projects.add('headlessmc-auth-yggdrasil')
        java8Projects.add('headlessmc-commands-auth')
        if (!java8Projects.contains(project.name)) {
            implementation platform(libs.quarkus)
            implementation libs.inject
            implementation libs.cdi
            implementation libs.slf4j
            runtimeOnly libs.slf4j.jboss

            testImplementation enforcedPlatform(libs.quarkus)
            testImplementation libs.quarkus.arc
            testImplementation libs.quarkus.core
            testImplementation libs.quarkus.junit.component
            testImplementation libs.quarkus.jacoco

            // TODO: check quarkus jackson-reflection-free-serializers
            // for @RegisterForReflection, could also use graalvm reflect-config for improved compatibility
            compileOnly libs.quarkus.core
        }
    }

    java {
        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
    }

    compileJava {
        options.encoding = 'UTF-8'
        options.compilerArgs << '-parameters'
    }

    compileTestJava {
        options.encoding = 'UTF-8'
        options.release = 25
    }

    test {
        useJUnitPlatform()
        if (providers.gradleProperty('hmc.files.location').present) {
            systemProperty 'hmc.files.location', providers.gradleProperty('hmc.files.location').get()
        }

        // Classes loaded by the QuarkusClassLoader are transformed, so the plain jacoco
        // agent records them under mismatched class ids; quarkus-jacoco records them
        // instead, writing into the same exec file (see the Quarkus JaCoCo guide).
        jacoco {
            excludeClassLoaders = ["*QuarkusClassLoader"]
        }

        systemProperty 'quarkus.jacoco.data-file', layout.buildDirectory.file('jacoco/test.exec').get().asFile.absolutePath
        systemProperty 'quarkus.jacoco.report', 'false'
        finalizedBy jacocoTestReport
    }

    jacocoTestReport {
        dependsOn test
    }


    publishing {
        publications {
            mavenJava(MavenPublication) {
                from components.java
            }
        }
        repositories {
            maven {
                url = uri("${project.rootProject.getLayout().buildDirectory.get()}/maven")
            }
        }
    }
}

publish {
    subprojects.each { dependsOn("${it.name}:publish") }
}

compileJava {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

tasks.register('jacocoRootReport', JacocoReport) {
    group 'verification'
    def coveredProjects = subprojects.findAll { it.plugins.hasPlugin('jacoco') }
    dependsOn coveredProjects.collect { "${it.path}:test" }

    executionData.setFrom(files({
        coveredProjects.collect {
            it.layout.buildDirectory.file('jacoco/test.exec').get().asFile
        }.findAll { it.exists() }
    }))
    sourceDirectories.setFrom(files(coveredProjects.collect { it.sourceSets.main.allSource.srcDirs }))
    classDirectories.setFrom(files(coveredProjects.collect {
        it.fileTree(dir: it.layout.buildDirectory.dir('classes/java/main').get().asFile, exclude: [])
    }))

    reports {
        xml.required = true
        html.required = true
        html.outputLocation = layout.buildDirectory.dir('reports/jacoco/root')
        xml.outputLocation = layout.buildDirectory.file('reports/jacoco/root/jacoco.xml')
    }
}
